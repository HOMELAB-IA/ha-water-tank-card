name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - run: npm ci

      - name: Audit (high+)
        run: npm audit --audit-level=high

      - name: Lint
        run: npx eslint src --ext .ts

      - name: Format check
        run: npx prettier --check "src/**/*.ts"

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check bundle size
        run: |
          SIZE=$(wc -c < dist/water-tank-card.js)
          echo "Bundle size: ${SIZE} bytes"
          if [ "$SIZE" -gt 131072 ]; then
            echo "Bundle exceeds 128 KB"
            exit 1
          fi

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - run: npm ci && npm run build

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/water-tank-card.js
          generate_release_notes: true
